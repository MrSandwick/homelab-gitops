controller:
  type: deployment
  replicas: 1

alloy:
  configMap:
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        // laptop node (owned by another admin, often offline): do not collect its logs
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          regex         = "nursultan-nitro-an515-57"
          action        = "drop"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [otelcol.receiver.loki.kafka.receiver]
      }


      // Kafka branch: convert Loki log entries to OTLP and publish them to Kafka
      otelcol.receiver.loki "kafka" {
        output {
          logs = [otelcol.exporter.kafka.default.input]
        }
      }

      otelcol.exporter.kafka "default" {
        brokers          = ["homelab-kafka-bootstrap.kafka.svc.cluster.local:9092"]
        protocol_version = "2.0.0"

        logs {
          topic    = "logs"
          encoding = "otlp_proto"
        }
      }
