# Single-node KRaft cluster: one pod acts as both controller and broker.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: kafka
  labels:
    strimzi.io/cluster: homelab
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 10Gi
        class: local-path
        deleteClaim: false      # keep the data if the cluster object is deleted
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      memory: 2Gi
  jvmOptions:
    -Xms: 1g
    -Xmx: 1g
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: homelab
  namespace: kafka
spec:
  kafka:
    version: 4.3.1
    metricsConfig:
      type: strimziMetricsReporter
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      # One broker: every replication setting must be 1.
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
  entityOperator:
    topicOperator: {}
    userOperator: {}
  kafkaExporter:
    topicRegex: ".*"
    groupRegex: ".*"
