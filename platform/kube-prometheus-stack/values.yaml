grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    type: pvc
    storageClassName: local-path
    accessModes: [ReadWriteOnce]
    size: 5Gi
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      isDefault: false

prometheus:
  prometheusSpec:
    externalLabels:
      cluster: homelab
    retention: 15d
    retentionSize: 8GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

alertmanager:
  templateFiles:
    slack.tmpl: |-
      {{ define "slack.homelab.title" -}}
      {{ if eq .Status "firing" }}{{ if eq .CommonLabels.severity "critical" }}🔴{{ else }}🟠{{ end }}{{ else }}✅{{ end }} [{{ or .CommonLabels.cluster "unknown-cluster" }}] {{ .CommonLabels.alertname }}{{ if gt (len .Alerts) 1 }} ({{ len .Alerts }}){{ end }}{{ if eq .Status "resolved" }} — resolved{{ end }}
      {{- end }}

      {{ define "slack.homelab.text" -}}
      {{ range .Alerts -}}
      *{{ if .Annotations.summary }}{{ .Annotations.summary }}{{ else }}{{ .Labels.alertname }}{{ end }}*
      {{ if .Annotations.description }}{{ .Annotations.description }}
      {{ end -}}
      • Severity: `{{ .Labels.severity }}`{{ if .Labels.namespace }}  • Namespace: `{{ .Labels.namespace }}`{{ end }}{{ if .Labels.pod }}  • Pod: `{{ .Labels.pod }}`{{ end }}{{ if .Labels.node }}  • Node: `{{ .Labels.node }}`{{ end }}
      • Since: {{ .StartsAt.Format "2006-01-02 15:04 MST" }}{{ if eq .Status "resolved" }}  • Resolved: {{ .EndsAt.Format "2006-01-02 15:04 MST" }}{{ end }}
      {{ if .Annotations.runbook_url }}• Runbook: {{ .Annotations.runbook_url }}
      {{ end }}
      {{ end -}}
      {{- end }}
  alertmanagerSpec:
    # mounted at /etc/alertmanager/secrets/alertmanager-slack/
    secrets:
      - alertmanager-slack
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
  config:
    global:
      resolve_timeout: 5m
    templates:
      - /etc/alertmanager/config/*.tmpl
    route:
      receiver: "null"
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        # internal heartbeat alerts, never notify
        - receiver: "null"
          matchers:
            - alertname =~ "Watchdog|InfoInhibitor"
        # laptop node (owned by another admin, often offline): ignore
        - receiver: "null"
          matchers:
            - node = "nursultan-nitro-an515-57"
        - receiver: "null"
          matchers:
            - instance =~ "192\\.168\\.20\\.122.*"
        - receiver: slack
          matchers:
            - severity =~ "warning|critical"
    inhibit_rules:
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity =~ "warning|info"
        equal: [namespace, alertname]
    receivers:
      - name: "null"
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook-url
            send_resolved: true
            color: '{{ if eq .Status "firing" }}{{ if eq .CommonLabels.severity "critical" }}danger{{ else }}warning{{ end }}{{ else }}good{{ end }}'
            title: '{{ template "slack.homelab.title" . }}'
            text: '{{ template "slack.homelab.text" . }}'
            title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}'
            text: |-
              {{ range .Alerts }}*{{ .Labels.severity }}* {{ .Annotations.summary }}
              {{ .Annotations.description }}
              {{ end }}
