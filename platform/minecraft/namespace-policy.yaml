# Namespace with a default-deny ingress policy; only the game port is open.
# RCON (25575) is not opened: nothing outside the pod can reach it.
apiVersion: v1
kind: Namespace
metadata:
  name: minecraft
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: minecraft
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-game-port
  namespace: minecraft
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 25565
          protocol: TCP
