# Single entry point for HTTP traffic. Envoy Gateway creates a LoadBalancer
# Service for it, so MetalLB assigns the external IP.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy
  infrastructure:
    annotations:
      # Keep the address that ingress-nginx used, so bookmarks keep working.
      metallb.universe.tf/loadBalancerIPs: 192.168.20.240
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All   # application teams attach their own HTTPRoutes
