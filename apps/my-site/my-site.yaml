apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-site
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-site
  template:
    metadata:
      labels:
        app: my-site
    spec:
      containers:
        - name: my-site
          image: ghcr.io/mrsandwick/my-site:6c00c05b5a7e24623a3d931d802f4a343caa3b00
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: my-site
spec:
  selector:
    app: my-site
  ports:
    - port: 80
      targetPort: 80
