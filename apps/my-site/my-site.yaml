apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-site
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-site
  template:
    metadata:
      labels:
        app: my-site
    spec:
      containers:
        - name: my-site
          image: ghcr.io/mrsandwick/my-site:9c0db67bbe086b18a2fbd1ef5468003c0041dcfc
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: my-site
spec:
  selector:
    app: my-site
  ports:
    - port: 80
      targetPort: 80
