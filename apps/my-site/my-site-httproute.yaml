apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: my-site
  namespace: default
spec:
  parentRefs:
    - name: homelab
      namespace: envoy-gateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /site
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /   # /site/x is served by the backend as /x
      backendRefs:
        - name: my-site
          port: 80
